name: Build & Release Desktop Installers (Windows & macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install & Detect OpenSSL (Windows Only)
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          choco install openssl -y --no-progress
          if (Test-Path "C:\Program Files\OpenSSL-Win64\include\openssl\crypto.h") {
            $dir = "C:\Program Files\OpenSSL-Win64"
          } elseif (Test-Path "C:\Program Files\OpenSSL\include\openssl\crypto.h") {
            $dir = "C:\Program Files\OpenSSL"
          } elseif (Test-Path "C:\tools\openssl\include\openssl\crypto.h") {
            $dir = "C:\tools\openssl"
          } else {
            Write-Error "OpenSSL include files not found!"
            exit 1
          }
          Write-Host "Detected OpenSSL at $dir"
          echo "OPENSSL_DIR=$dir" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$dir\lib" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$dir\include" >> $env:GITHUB_ENV

      - name: Install Dependencies
        run: npm install

      - name: Build Tauri Application & Release Artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Partisipasi Sekolah Desktop ${{ github.ref_name }}'
          releaseBody: 'Silakan unduh file installer .exe / .msi (Windows) atau .dmg (macOS) di bawah ini.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
