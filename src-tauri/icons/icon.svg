<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Logo Partisipasi Sekolah - PMTI SMAN 1 GEDEG</title>
  <defs>
    <!-- Background Gradient: Deep Authority Navy -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00264d"/>
      <stop offset="100%" stop-color="#001833"/>
    </linearGradient>

    <!-- Loop Arc Gradient: Vibrant Emerald to Cyan -->
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d084"/>
      <stop offset="100%" stop-color="#0099ff"/>
    </linearGradient>

    <!-- Star Accent Gradient -->
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffc837"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="#254b77" stroke-width="4"/>

  <!-- Left Stem of Monogram 'P': Solid Educational Pillar -->
  <rect x="136" y="128" width="56" height="256" rx="28" fill="#ffffff"/>

  <!-- Upper Loop of Monogram 'P': Interlocking Participation Arc -->
  <path d="M 192 128 
           H 288 
           C 362 128, 416 172, 416 240 
           C 416 308, 362 352, 288 352 
           H 192 
           V 296 
           H 284 
           C 326 296, 356 272, 356 240 
           C 356 208, 326 184, 284 184 
           H 192 
           Z" 
        fill="url(#arc)"/>

  <!-- Golden Contribution Star / Academic Diamond inside Loop -->
  <path d="M 270 240 
           L 279 218 
           L 301 209 
           L 279 200 
           L 270 178 
           L 261 200 
           L 239 209 
           L 261 218 
           Z" 
        fill="url(#star)"/>

  <!-- Bottom Forward Leaflet / Gotong Royong Seed -->
  <circle cx="164" cy="356" r="14" fill="#00d084"/>
</svg>
